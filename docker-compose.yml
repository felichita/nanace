# Local stack. `docker compose up -d` starts PostgreSQL and Qdrant (for
# `make run` / the test suite). The API server is in the `app` profile:
# `docker compose --profile app up -d --build` (or `make up`) runs it from the
# Dockerfile against the same databases. Ports bind to loopback unless
# NANACE_HOST_BIND says otherwise (e.g. 0.0.0.0 to share on the LAN).
name: nanace

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Bootstrap superuser; the app uses the `nanace` role from init.sql.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${NANACE_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanace -d nanace"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:${NANACE_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${NANACE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  server:
    profiles: [app]
    build: .
    image: nanace-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    # Secrets and settings (JWT secret, Google sign-in, ...) come from .env;
    # the values below win over it because they differ inside the container.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nanace:nanace@postgres:5432/nanace
      QDRANT_URL: http://qdrant:6334
      NANACE_BIND: 0.0.0.0:8080
      FASTEMBED_CACHE_DIR: /models
      NANACE_EMBEDDER: fastembed
      # Unverified email login stays off unless explicitly enabled here.
      NANACE_DEV_LOGIN: ${NANACE_COMPOSE_DEV_LOGIN:-false}
      NANACE_LOG_FORMAT: ${NANACE_LOG_FORMAT:-text}
      NANACE_METRICS_BIND: 0.0.0.0:9090
    ports:
      - "${NANACE_HOST_BIND:-127.0.0.1}:${NANACE_PORT:-8080}:8080"
      # Prometheus metrics, loopback only.
      - "127.0.0.1:${NANACE_METRICS_PORT:-9090}:9090"

  # Integration tests only: in-memory storage, emptied on every restart.
  qdrant-test:
    profiles: [test]
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:${NANACE_QDRANT_TEST_HTTP_PORT:-6335}:6333"
      - "127.0.0.1:${NANACE_QDRANT_TEST_GRPC_PORT:-6336}:6334"
    tmpfs:
      - /qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
